<body>
        <h1>Edit Page</h1>
            <h2>Task to Edit</h2>
        <div class="task-edit-container">
            <input type="text" id="editTaskInput">
            <input type="date" id="editTaskDate">
            <select id="editTaskUrgency">
                <option value="Low">Low</option>
                <option value="Medium">Medium</option>
                <option value="High">High</option>
            </select>
        </div>  

        <button onclick="updateTask()">Save Changes</button>
        <button onclick="markAsComplete()">Mark as Complete</button>
        <button onclick="deleteTaskFromEdit()">Delete Task</button>
